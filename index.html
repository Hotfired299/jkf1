<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RITZ99 // 终极博弈</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0a051b;
            color: #ffffff;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(128, 0, 128, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(128, 0, 128, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* 霓虹发光文字 */
        .neon-text {
            color: #fff;
            text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 20px #8a2be2;
        }

        /* 容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 第一屏 */
        header {
            padding: 30px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #00ffff, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero {
            padding: 100px 0;
            text-align: center;
            position: relative;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        .hero p {
            font-size: 1.2rem;
            color: #b0a8d4;
            max-width: 600px;
            margin: 0 auto 40px auto;
            line-height: 1.6;
        }

        /* 赛博朋克按钮 */
        .btn-cyber {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            color: #00ffff;
            border: 2px solid #00ffff;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .btn-cyber:hover {
            color: #0a051b;
            background: #00ffff;
            box-shadow: 0 0 25px #00ffff;
        }

        /* 特性区域 */
        .features {
            padding: 80px 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        /* 磨砂玻璃卡片 */
        .card {
            background: rgba(13, 8, 34, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 8px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, #00ffff, #8a2be2);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #00ffff;
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.1);
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #00ffff;
        }

        .card p {
            color: #a29bbd;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* 底部注册表单 */
        .cta-section {
            padding: 100px 0;
            text-align: center;
            background: linear-gradient(180deg, transparent, rgba(138, 43, 226, 0.1));
            border-top: 1px solid rgba(138, 43, 226, 0.2);
        }

        .form-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .form-container input {
            padding: 15px 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #8a2be2;
            color: #fff;
            font-size: 1rem;
        }

        .form-container input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .btn-purple {
            padding: 15px 30px;
            background: #8a2be2;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-purple:hover {
            background: #a046f5;
            box-shadow: 0 0 15px #8a2be2;
        }
    </style>
</head>
<body>

    <header>
        <div class="container" style="display: flex; justify-content: space-between; width: 100%;">
            <div class="logo">RITZ99</div>
            <div style="color: #00ffff; font-size: 0.9rem; letter-spacing: 1px;">STATUS: ONLINE</div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1 class="neon-text">RITZ99 // 触手可及的终极博弈</h1>
            <p>拒绝平庸，加入属于顶尖玩家的电竞新纪元。策略、操作与速度的绝对较量，你准备好了吗？</p>
            <a href="#join" class="btn-cyber">立即加入内测</a>
        </div>
    </section>

    <section class="container features">
        <div class="card">
            <h3>【 巅峰对决 】</h3>
            <p>纯粹的竞技策略，拒绝数值压制。在每一次交锋中算计对手，每一步都是智商与心理的极致博弈。</p>
        </div>
        <div class="card">
            <h3>【 赛博生态 】</h3>
            <p>专为硬核玩家打造的数字化电竞社区。在这里用实力说话，赢取属于你的独家荣耀与数字资产。</p>
        </div>
        <div class="card">
            <h3>【 瞬息万变 】</h3>
            <p>完美融合卡牌、棋子与博弈宝石元素。战场局势瞬息万变，唯有洞察全局者方能笑到最后。</p>
        </div>
    </section>

    <section class="cta-section" id="join">
        <div class="container">
            <h2 style="font-size: 2rem; margin-bottom: 10px;">霓虹永不熄灭，传奇由你书写</h2>
            <p style="color: #a29bbd;">立即留下联系方式，锁定首批核心测试席位。</p>
            <div class="form-container">
                <input type="email" placeholder="输入您的电子邮箱地址...">
                <button class="btn-purple">锁定席位</button>
            </div>
        </div>
    </section>

</body>
</html>
