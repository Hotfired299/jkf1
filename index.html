    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        input, textarea, button, a, div { -webkit-tap-highlight-color: rgba(0,0,0,0); outline: none; }

        body { 
            background-color: #03140a; 
            color: #ffffff; 
            overflow-x: hidden; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://static.gwvkyk.com/media/7c6a84e18f4a68652eee2.png') no-repeat center top;
            background-size: cover;
            opacity: 0.10; 
            z-index: -1;
        }
        
        header { 
            width: 100%; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.2); max-width: 500px; background: rgba(3, 20, 10, 0.85);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .logo { font-size: 20px; font-weight: bold; color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.6); letter-spacing: 1px; }
        
        .main-container { 
            max-width: 500px; width: 100%; padding: 15px; text-align: center; flex: 1;
            background: rgba(3, 20, 10, 0.5); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        
        .banner-link { display: block; width: 100%; text-decoration: none; margin-bottom: 20px; }
        .promo-banner { width: 100%; height: auto; border-radius: 10px; border: 2px solid #d4af37; box-shadow: 0 0 18px rgba(0, 255, 102, 0.25); display: block; }

        /* ====== Slot 机身架构 ====== */
        .slot-machine {
            background: linear-gradient(180deg, #144225, #072213);
            border: 4px solid #d4af37;
            border-radius: 16px;
            padding: 20px 15px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3), inset 0 0 15px rgba(0,0,0,0.5);
            max-width: 340px;
            margin: 0 auto 25px auto;
            position: relative;
        }
        
        .slot-title {
            font-size: 1.1rem; font-weight: 900; color: #ffcc00; margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(255,204,0,0.6); letter-spacing: 2px;
            animation: blink 0.8s infinite alternate;
        }
        @keyframes blink { from { opacity: 0.6; } to { opacity: 1; } }

        /* 滚轴可视窗口 */
        .slot-reels-container {
            display: flex;
            justify-content: space-between;
            background: #020d06;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            overflow: hidden;
            height: 90px; /* 锁定高度，确保只显示中间那一行 */
        }

        .reel {
            width: 30%;
            height: 100%;
            background: linear-gradient(180deg, #0d2a18, #05140b);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(212,175,55,0.2);
        }

        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            transform: translateY(0);
        }

        /* 核心修改：抛弃系统Emoji，改用全兼容的精美纯文字标签，确保100%有显示 */
        .slot-icon {
            height: 70px; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 900;
            user-select: none;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        
        /* 不同的水果/金币代号样式 */
        .icon-bar { color: #aaa; font-size: 1.3rem; }
        .icon-cherry { color: #ff3366; }
        .icon-wild { color: #00ff66; text-shadow: 0 0 8px #00ff66; }
        .icon-coin { color: #ffcc00; }
