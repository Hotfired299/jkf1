
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Great Blue Landing Page</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #000;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    .container {
        width: 100%;
        max-width: 600px;
        text-align: center;
        animation: fadeIn 1.2s ease;
        padding: 20px;
    }

    img {
        width: 100%;
        max-width: 550px;
        border-radius: 15px;
        animation: floatUp 2.5s ease infinite alternate;
    }

    .btn {
        margin-top: 25px;
        padding: 18px 35px;
        background: red;
        color: #fff;
        text-decoration: none;
        font-size: 22px;
        border-radius: 10px;
        font-weight: bold;
        display: inline-block;
        animation: pulse 1.6s ease-in-out infinite;
        box-shadow: 0 0 18px rgba(255, 0, 0, 0.6);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatUp {
        from { transform: translateY(0); }
        to { transform: translateY(-10px); }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.06); }
        100% { transform: scale(1); }
    }
</style>
</head>
