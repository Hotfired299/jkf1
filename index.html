body{

background-size:cover;

.hero{text-align:center;padding:40px 20px;position:relative}
.logo{font-size:64px;font-weight:900;color:#3cff78;text-shadow:0 0 20px #3cff78}
.trophy{position:absolute;left:5%;top:120px;font-size:120px}
.player{position:absolute;right:5%;top:100px;font-size:140px}
.ball{
font-size:70px;display:inline-block;
animation:spin 6s linear infinite;
}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.title{
font-size:clamp(38px,6vw,78px);
font-weight:900;
text-shadow:0 0 20px gold;
margin-top:20px;
}
.subtitle{font-size:22px;margin-top:10px}
.features{
display:flex;justify-content:center;gap:25px;flex-wrap:wrap;
margin:30px 0;
}
.feature{
background:rgba(255,255,255,.12);
padding:15px 25px;border-radius:15px;

}
.btn{
display:inline-block;
padding:18px 48px;
font-size:28px;
font-weight:bold;
text-decoration:none;
border-radius:50px;
background:linear-gradient(90deg,#f7d36d,#d9a400);
color:#111;
box-shadow:0 0 25px rgba(255,215,0,.8);
animation:pulse 2s infinite;
}
@keyframes pulse{
50%{transform:scale(1.05)}
}
.bonus{
margin-top:20px;
font-size:36px;
font-weight:900;
color:#ffda44;
}
.flags{
position:fixed;bottom:70px;left:0;width:100%;
overflow:hidden;
}
.track{
display:flex;gap:18px;width:max-content;
animation:scroll 20s linear infinite;
}
.flag{font-size:54px;background:#fff;border-radius:10px;padding:8px 12px}
@keyframes scroll{
from{transform:translateX(0)}
to{transform:translateX(-50%)}
}
.footer{
position:fixed;bottom:15px;width:100%;
text-align:center;font-weight:bold;
}
@media(max-width:768px){
.player,.trophy{font-size:70px;top:140px}
.title{margin-top:80px}
}
